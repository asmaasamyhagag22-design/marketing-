<!doctype html><html lang="en"><head><title>Debian -- About Debian</title></head><body><main><section><h2>What hardware is supported?</h2><p>Debian will run on almost all personal computers, including most older models. Each new release of Debian generally supports a larger number of computer architectures. For a complete list of currently supported ones, see the documentation for the stable release .</p></section></main></body></html>
