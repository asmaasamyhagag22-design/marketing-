<!doctype html><html lang="en"><head><title>Mars: Facts - NASA Science</title></head><body><main><section><h2>Orbit and Rotation</h2><p>As Mars orbits the Sun, it completes one rotation every 24.6 hours, which is very similar to one day on Earth (23.9 hours). Martian days are called sols — short for &quot;solar day.&quot; A year on Mars lasts 669.6 sols, which is the same as 687 Earth days.</p></section></main></body></html>
